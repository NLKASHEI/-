name: Inspect SWF asset dependencies
on:
  push:
    branches: [main]
    paths: [".github/workflows/check-assets.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scan original SWF external file references
        shell: python
        run: |
          import urllib.request,re,zlib,struct,os
          src='https://comdotcdn.com/4x90xhl3k0/games/files/875ed08dec9f3666cd8b7fbf36d51722.swf'
          req=urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.comdotgame.com/play/witch-girl'})
          with urllib.request.urlopen(req,timeout=90) as r: b=r.read()
          print('SWF size',len(b),'header',repr(b[:8]),'declared_size',struct.unpack('<I',b[4:8])[0])
          unpacked=b[:8].replace(b'CWS',b'FWS',1)+zlib.decompress(b[8:]) if b[:3]==b'CWS' else b
          print('Unpacked size',len(unpacked))
          pats=[rb'[^\x00-\x1f\x7f-\xff]{4,}',rb'[\x20-\x7e]{4,}']
          relevant=[]
          for m in re.finditer(rb'[\x20-\x7e]{4,}',unpacked):
              val=m.group().decode('ascii','ignore')
              if re.search(r'(\.(swf|png|jpg|jpeg|mp3|ogg|wav|xml|txt|bin|dat|json)|/|\\|asset|data|load|\.as$)',val,re.I):
                  relevant.append(val[:200])
          print('matching printable strings',len(relevant))
          for line in list(dict.fromkeys(relevant))[:250]:
              print('REF',repr(line))
          print('URLs',set(re.findall(rb'https?://[^\x00-\x20"<>]{6,150}',unpacked,re.I)))
