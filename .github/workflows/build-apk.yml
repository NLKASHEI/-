name: Build offline APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download genuine game SWF for offline APK
        run: python3 tools/fetch_game.py
      - name: Bundle local Ruffle runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/ruffle" --no-audit --no-fund @ruffle-rs/ruffle@0.7.1
          python3 - <<'PY'
          from pathlib import Path
          import shutil, os
          root=Path(os.environ['RUNNER_TEMP'])/'ruffle/node_modules/@ruffle-rs/ruffle'
          candidates=sorted(root.rglob('ruffle.js'),key=lambda p:len(p.parts))
          print('Found ruffle.js:',candidates)
          if not candidates: raise RuntimeError('Ruffle runtime JS missing')
          src=candidates[0].parent
          dst=Path('app/src/main/assets/ruffle')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          wasm=list(dst.rglob('*.wasm'))
          print('Bundled Ruffle',src,'WASM modules:',len(wasm))
          if not wasm: raise RuntimeError('Ruffle WebAssembly missing')
          PY
      - name: Assemble offline APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK includes offline resources
        run: |
          python3 - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert 'assets/game.swf' in names, 'Missing game SWF'
              assert 'assets/ruffle/ruffle.js' in names, 'Missing local Ruffle'
              assert any(x.startswith('assets/ruffle/') and x.endswith('.wasm') for x in names),'Missing WASM runtime'
              assert z.getinfo('assets/game.swf').file_size>100_000
              print('Validated offline APK. Files:',len(names),'SWF bytes:',z.getinfo('assets/game.swf').file_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Witch-Girl-offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
