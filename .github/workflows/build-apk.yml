name: Build offline APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve APK signing key for future upgrades
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: witchgirl-android-signing-debug-v1
      - name: Ensure stable APK signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Download genuine game SWF for offline APK
        run: python3 tools/fetch_game.py
      - name: Bundle local Ruffle runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/ruffle" --no-audit --no-fund @ruffle-rs/ruffle@0.7.1
          python3 - <<'PY'
          from pathlib import Path
          import shutil, os
          root=Path(os.environ['RUNNER_TEMP'])/'ruffle/node_modules/@ruffle-rs/ruffle'
          candidates=sorted(root.rglob('ruffle.js'),key=lambda p:len(p.parts))
          print('Found ruffle.js:',candidates)
          if not candidates: raise RuntimeError('Ruffle runtime JS missing')
          src=candidates[0].parent
          dst=Path('app/src/main/assets/ruffle')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          wasm=list(dst.rglob('*.wasm'))
          print('Bundled Ruffle',src,'WASM modules:',len(wasm))
          if not wasm: raise RuntimeError('Ruffle WebAssembly missing')
          PY
      - name: Assemble offline APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK includes offline resources
        run: |
          python3 - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert 'assets/game.swf' in names, 'Missing game SWF'
              assert 'assets/ruffle/ruffle.js' in names, 'Missing local Ruffle'
              assert any(x.startswith('assets/ruffle/') and x.endswith('.wasm') for x in names),'Missing WASM runtime'
              assert z.getinfo('assets/game.swf').file_size>100_000
              bundled_swfs=[name for name in names if name.startswith('assets/witch-girl-u/2.20/data/') and name.endswith('.swf')]
              bundled_music=[name for name in names if name.startswith('assets/witch-girl-u/2.20/sound/') and name.endswith('.mp3')]
              assert len(bundled_swfs)>=45, 'Missing game characters: '+str(len(bundled_swfs))
              assert len(bundled_music)>=7, 'Missing soundtrack: '+str(len(bundled_music))
              print('Validated external assets: SWF',len(bundled_swfs),'MP3',len(bundled_music))
              print('Validated offline APK. Files:',len(names),'SWF bytes:',z.getinfo('assets/game.swf').file_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Witch-Girl-offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
