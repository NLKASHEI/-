name: Check SWF mirrors
on:
  push:
    branches: [main]
    paths: [".github/workflows/check-mirrors.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        name: Verify original game asset endpoints
        run: |
          import urllib.request,re,html
          pageurl='https://www.comdotgame.com/play/witch-girl'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
          headers={'User-Agent':ua,'Referer':pageurl}
          with urllib.request.urlopen(urllib.request.Request(pageurl,headers=headers),timeout=30) as r:
              page=r.read().decode('utf-8','replace')
          p=page.find('.swf')
          print('SWF page context',repr(page[max(p-500,0):p+180]))
          x=re.search(r'([a-f0-9]{32}\.swf)',page,re.I)
          assert x
          file=x.group(1)
          urls=[
             'https://comdotcdn.com/games/files/'+file,
             'https://comdotcdn.com/4x90xhl3k0/games/files/'+file,
             'https://echo.comdotgame.com/games/files/'+file,
             'https://echo.comdotgame.com/4x90xhl3k0/games/files/'+file,
             'https://www.comdotgame.com/games/files/'+file,
             'https://comdotgame.com/games/files/'+file,
             'https://echo.comdotgame.com/games/files/'+file+'?game=witch-girl'
          ]
          for u in urls:
              for ref in [pageurl,'https://comdotgame.com/','']:
                  h={'User-Agent':ua}
                  if ref:h['Referer']=ref
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=10) as r:
                          dat=r.read(12)
                          print('OK',u,'REFERER',ref,'STATUS',r.status,'SIGNATURE',repr(dat[:3]),'CONTENT-TYPE',r.headers.get('Content-Type'))
                  except Exception as e:
                      print('FAIL',u,'REFERER',ref,repr(e))
