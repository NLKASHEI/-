<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#050507; color:white; font-family:sans-serif; }
body { display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:100%; height:100%; overflow:hidden; background:#08090b; }
ruffle-player { display:block; width:100%; height:100%; outline:0; touch-action:manipulation; }
#status { position:absolute; left:5%; right:5%; top:45%; z-index:1; text-align:center; pointer-events:none; font-size:13px; white-space:pre-line; }
</style>
</head>
<body>
<div id="stage"><div id="status">加载离线资源…</div></div>
<script>
(function () {
  // Ruffle uses localStorage for Flash SharedObject (.sol) data.
  // Restore native backup BEFORE Ruffle starts reading save data.
  const native = window.AndroidSave;
  let lastSnapshot = null;
  const STORAGE_ID = 'WitchGirlOfflineNativeBackupV1';
  function serialize() {
    const items = Object.create(null);
    try {
      for (let i = 0; i < localStorage.length; ++i) {
        const key = localStorage.key(i);
        if (key != null && key !== STORAGE_ID) items[key] = localStorage.getItem(key);
      }
    } catch (e) { console.warn('Storage unavailable', e); }
    return JSON.stringify({version:1, items:items});
  }
  function restoreNative() {
    if (!native) return;
    try {
      const stored = native.load();
      if (!stored) return;
      const backup = JSON.parse(stored);
      if (backup.version !== 1 || !backup.items) return;
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        if (localStorage.key(i) !== STORAGE_ID) count++;
      }
      // Preserve existing saves from v1.0.0; only restore native backup if
      // WebView's localStorage was lost or cleared.
      if (count === 0) {
        Object.keys(backup.items).forEach((k) => {
          if (typeof backup.items[k] === "string") localStorage.setItem(k, backup.items[k]);
        });
      }
    } catch (e) { console.warn('Save restore failed', e); }
  }
  function snapshot(force) {
    try {
      if (!native) return "No AndroidSave bridge";
      const state = serialize();
      if (force || state !== lastSnapshot) {
        native.save(state);
        lastSnapshot = state;
      }
      return state;
    } catch (e) { console.error('Save backup failed', e); return ""; }
  }
  function importBackup(raw) {
    try {
      const backup = JSON.parse(raw);
      if (backup.version !== 1 || !backup.items || typeof backup.items !== 'object') return false;
      localStorage.clear();
      Object.keys(backup.items).forEach((key) => {
        if (typeof backup.items[key] === 'string') localStorage.setItem(key, backup.items[key]);
      });
      lastSnapshot = null;
      snapshot(true);
      return true;
    } catch (e) { console.error('Save import failed', e); return false; }
  }
  restoreNative();
  window.WitchSave = {snapshot, importBackup};
  setInterval(() => snapshot(false), 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) snapshot(true); });
  window.addEventListener('pagehide', () => snapshot(true));
  window.addEventListener('beforeunload', () => snapshot(true));
  snapshot(true);
})();
</script>
<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  const status = document.getElementById('status');
  const query = new URLSearchParams(location.search);
  const validRenderers = new Set(['wgpu-webgl','webgl','canvas']);
  const renderer = validRenderers.has(query.get('renderer')) ? query.get('renderer') : 'wgpu-webgl';
  const validScales = new Set(['exactfit','showAll','noborder']);
  const scale = validScales.has(query.get('scale')) ? query.get('scale') : 'exactfit';
  const quality = query.get('quality') === 'medium' ? 'medium' : 'low';
  let recovered = false;
  let player;

  // Reduces GPU MSAA overhead on phones. The normal default uses a heavier path.
  const config = {
    autoplay:'on', unmuteOverlayVisibility:'hidden',
    preferredRenderer:renderer, quality:quality,
    scale:scale, forceScale:true, letterbox:'off',
    allowScriptAccess:false, logLevel:'warn',
    publicPath:'ruffle/', contextMenu:'off',
    openUrlMode:'deny', allowNetworking:'internal'
  };
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = config;

  function showError(reason) {
    status.style.display='block';
    status.textContent=reason+'\n可以点击右上角「画面」切换渲染方式，或使用「恢复画面」。';
  }

  function watchGpu() {
    // The renderer lives inside Ruffle's shadow DOM, not the HTML stage.
    const root = player && player.shadowRoot;
    if (!root) return;
    let lost = false;
    function attach() {
      root.querySelectorAll('canvas').forEach(canvas => {
        if (canvas.__witchCanvasObserved) return;
        canvas.__witchCanvasObserved = true;
        canvas.addEventListener('webglcontextlost', (event) => {
          event.preventDefault();
          lost = true;
          showError('GPU 渲染上下文丢失（可能导致白屏）。');
          if (!recovered) {
            recovered=true;
            setTimeout(() => {
              if (lost && window.AndroidRecovery) window.AndroidRecovery.onGpuLost();
            }, 2500);
          }
        });
        canvas.addEventListener('webglcontextrestored', () => {
          lost = false;
          status.style.display='none';
        });
      });
    }
    attach();
    new MutationObserver(attach).observe(root, {childList:true,subtree:true});
  }

  try {
    const api = window.RufflePlayer.newest();
    player = api.createPlayer();
    const stage = document.getElementById('stage');
    stage.insertBefore(player,status);
    player.ruffle().config = config;
    watchGpu();
    const base = 'https://appassets.androidplatform.net/assets/witch-girl-u/2.20/';
    Promise.resolve(player.ruffle().load({
      url:'game.swf', base:base,
      preferredRenderer:renderer, quality:quality,
      scale:scale, forceScale:true
    })).then(() => {
      status.style.display='none';
      player.focus();
    }).catch(e => {
      showError('游戏启动失败：'+String(e));
      console.error('Ruffle game load failed', e);
    });
  } catch(e) {
    showError('Ruffle 初始化失败：'+String(e));
    console.error('Ruffle init error', e);
  }
})();
</script>
</body>
</html>
