plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nlkashei.witchgirl'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nlkashei.witchgirl.offline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
    }
}
