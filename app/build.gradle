plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nlkashei.witchgirl'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nlkashei.witchgirl.offline'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    androidResources {
        // Flash SWF is already zlib-compressed. Avoid extra ZIP inflation of
        // the movie, media and WebAssembly while WebView streams them.
        noCompress += ['swf', 'wasm', 'mp3']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
    }
}
